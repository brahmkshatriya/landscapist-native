name: Publish

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish'
        required: true
        type: string
  push:
    tags:
      - '*'

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    name: Release build and publish
    runs-on: macos-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v7.0.1

      - name: Set up JDK 21
        uses: actions/setup-java@v5.7.0
        with:
          distribution: 'temurin'
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Restore Gradle properties and signing key
        shell: bash
        env:
          GRADLE_PROPERTIES_CONTENT: ${{ secrets.GRADLE_PROPERTIES_CONTENT }}
          GPG_SECRET_KEY_RING_BASE64: ${{ secrets.GPG_SECRET_KEY_RING_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$GRADLE_PROPERTIES_CONTENT"
          test -n "$GPG_SECRET_KEY_RING_BASE64"
          gradle_dir="$HOME/.gradle"
          properties_file="$gradle_dir/gradle.properties"
          keyring="$gradle_dir/landscapist-secret-key.gpg"
          mkdir -p "$gradle_dir"
          printf '%s' "$GRADLE_PROPERTIES_CONTENT" > "$properties_file"
          printf '%s' "$GPG_SECRET_KEY_RING_BASE64" | tr -d '\r\n ' | openssl base64 -d -A > "$keyring"
          test -s "$keyring"
          awk '!/^signing.secretKeyRingFile=/' "$properties_file" > "$properties_file.tmp"
          mv "$properties_file.tmp" "$properties_file"
          printf '\nsigning.secretKeyRingFile=%s\n' "$keyring" >> "$properties_file"
          chmod 600 "$properties_file" "$keyring"

      - name: Resolve release version
        shell: bash
        env:
          MANUAL_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            release_version="$MANUAL_VERSION"
          else
            release_version="$GITHUB_REF_NAME"
          fi

          if [[ ! "$release_version" =~ ^[0-9A-Za-z][0-9A-Za-z._-]*$ ]]; then
            echo "Invalid Maven version: $release_version" >&2
            exit 1
          fi

          echo "Publishing version: $release_version"
          echo "ORG_GRADLE_PROJECT_landscapistVersion=$release_version" >> "$GITHUB_ENV"

      - name: Publish to MavenCentral
        run: |
          ./gradlew \
            :landscapist:publishToMavenCentral \
            :landscapist-core:publishToMavenCentral \
            :landscapist-image:publishToMavenCentral \
            :landscapist-animation:publishToMavenCentral \
            :landscapist-placeholder:publishToMavenCentral \
            :landscapist-palette:publishToMavenCentral \
            --no-configuration-cache
